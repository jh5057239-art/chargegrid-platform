name: PHP syntax checks
on:
  push:
    branches: [php-hostinger-infinityfree]
  pull_request:
    branches: [php-hostinger-infinityfree]
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Check PHP syntax
        run: php -l index.php && php -l config.example.php
