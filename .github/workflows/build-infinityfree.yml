name: Build InfinityFree upload package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: chargegrid
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip, bcmath, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Configure temporary environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: chargegrid
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Create MySQL schema and demo data
        run: |
          php artisan migrate --force
          php artisan db:seed --force
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: chargegrid
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Export database for phpMyAdmin
        run: |
          mysqldump --host=127.0.0.1 --port=3306 --user=root --password=root --no-tablespaces --skip-comments --compact chargegrid > database-infinityfree.sql
          test -s database-infinityfree.sql

      - name: Prepare writable Laravel directories
        run: |
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          find bootstrap/cache -type f ! -name '.gitignore' -delete
          find storage/framework/cache storage/framework/sessions storage/framework/views storage/logs -type f -delete

      - name: Create upload ZIP
        run: |
          mkdir -p dist
          zip -qr dist/chargegrid-infinityfree.zip . \
            -x '.git/*' '.github/*' 'tests/*' 'node_modules/*' 'vendor/bin/*' \
               '.env' '.env.local' '.env.production' '.env.testing' \
               'Dockerfile' 'docker/*' 'render.yaml' 'dist/*' '.gitignore'

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: chargegrid-infinityfree
          path: dist/chargegrid-infinityfree.zip
          if-no-files-found: error
