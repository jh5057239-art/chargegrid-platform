name: Build InfinityFree upload package

on:
  push:
    branches: [infinityfree-deploy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: chargegrid
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, zip, bcmath, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Configure temporary environment and create app key
        run: |
          cp .env.example .env
          php artisan key:generate --force
          APP_KEY_VALUE="$(grep '^APP_KEY=' .env | cut -d= -f2-)"
          cat > .env.infinityfree <<EOF
          APP_NAME=ChargeGrid
          APP_ENV=production
          APP_KEY=${APP_KEY_VALUE}
          APP_DEBUG=false
          APP_URL=https://REPLACE-WITH-YOUR-FREE-SUBDOMAIN

          APP_LOCALE=es
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=es_MX

          LOG_CHANNEL=single
          LOG_LEVEL=error

          DB_CONNECTION=mysql
          DB_HOST=REPLACE-WITH-INFINITYFREE-MYSQL-HOST
          DB_PORT=3306
          DB_DATABASE=REPLACE-WITH-DATABASE-NAME
          DB_USERNAME=REPLACE-WITH-DATABASE-USERNAME
          DB_PASSWORD=REPLACE-WITH-DATABASE-PASSWORD

          SESSION_DRIVER=file
          SESSION_LIFETIME=120
          CACHE_STORE=file
          QUEUE_CONNECTION=sync
          MAIL_MAILER=log
          EOF
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: chargegrid
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Create MySQL schema and demo data
        run: |
          php artisan migrate --force
          php artisan db:seed --force
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: chargegrid
          DB_USERNAME: root
          DB_PASSWORD: root

      - name: Export database for phpMyAdmin
        run: |
          mysqldump --host=127.0.0.1 --port=3306 --user=root --password=root --no-tablespaces --skip-comments --compact chargegrid > database-infinityfree.sql
          test -s database-infinityfree.sql

      - name: Prepare writable Laravel directories
        run: |
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          find bootstrap/cache -maxdepth 1 -type f -name 'config.php' -delete
          find bootstrap/cache -maxdepth 1 -type f -name 'events.php' -delete
          find bootstrap/cache -maxdepth 1 -type f -name 'routes-*.php' -delete
          find storage/framework/cache storage/framework/sessions storage/framework/views storage/logs -type f -delete

      - name: Create upload ZIP
        run: |
          mkdir -p dist
          zip -qr dist/chargegrid-infinityfree.zip . \
            -x '.git/*' '.github/*' 'tests/*' 'node_modules/*' 'vendor/bin/*' \
               '.env' '.env.local' '.env.production' '.env.testing' \
               'Dockerfile' 'docker/*' 'render.yaml' 'dist/*' '.gitignore'

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: chargegrid-infinityfree
          path: dist/chargegrid-infinityfree.zip
          if-no-files-found: error
